services:
  db:
    image: postgres
    restart: unless-stopped
    shm_size: 256mb
    ports:
      - "5432:5432"
    volumes:
      - db:/var/lib/postgresql/data
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: run/secrets/db_user
      POSTGRES_PASSWORD: run/secrets/db_password

volumes:
  db:

secrets:
   db_password:
     file: db_password.txt
   db_user:
     file: db_user.txt